name: KampusAgi
options:
  bundleIdPrefix: com.kampusagi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  usesTabs: false
  indentWidth: 4

configs:
  Debug-Development: debug
  Release-Development: release
  Debug-Staging: debug
  Release-Staging: release
  Debug-Production: debug
  Release-Production: release

configFiles:
  Debug-Development: Configs/Development.xcconfig
  Release-Development: Configs/Development.xcconfig
  Debug-Staging: Configs/Staging.xcconfig
  Release-Staging: Configs/Staging.xcconfig
  Debug-Production: Configs/Production.xcconfig
  Release-Production: Configs/Production.xcconfig

packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_LDFLAGS: "$(inherited)"

targets:
  KampusAgi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KampusAgi
    resources:
      - path: KampusAgi/Resources
    info:
      path: KampusAgi/Resources/Info.plist
      properties:
        CFBundleDisplayName: KampüsAğı
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Öğrenci belgenizi tarayabilmek için kameraya erişim gerekebilir."
        NSPhotoLibraryUsageDescription: "Profil fotoğrafı seçebilmek için fotoğraf kütüphanesine erişim gerekir."
        NSLocationWhenInUseUsageDescription: "Kampüs içi eşleşmeleri gösterebilmek için konumunuza ihtiyacımız var. Bu izin isteğe bağlıdır."
        NSUserTrackingUsageDescription: "Size daha alakalı içerik gösterebilmek için bu veriyi kullanacağız."
        FirebaseAppDelegateProxyEnabled: false
        API_BASE_URL: $(API_BASE_URL)
        FIREBASE_PROJECT_ID: $(FIREBASE_PROJECT_ID)
        GEMINI_TEXT_MODEL: $(GEMINI_TEXT_MODEL)
        GEMINI_EMBEDDING_MODEL: $(GEMINI_EMBEDDING_MODEL)
        GOOGLE_SIGN_IN_CLIENT_ID: $(GOOGLE_SIGN_IN_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_SIGN_IN_URL_SCHEME)
    entitlements:
      path: KampusAgi/Resources/KampusAgi.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kampusagi.app
        PRODUCT_NAME: KampüsAğı
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseAppCheck
      - package: FirebaseiOS
        product: FirebaseCrashlytics
      - package: FirebaseiOS
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn

  KampusAgiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KampusAgiTests
    dependencies:
      - target: KampusAgi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  KampusAgiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KampusAgiUITests
    dependencies:
      - target: KampusAgi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KampusAgi-Development:
    build:
      targets:
        KampusAgi: all
    run:
      config: Debug-Development
    test:
      config: Debug-Development
      targets:
        - KampusAgiTests
        - KampusAgiUITests
    archive:
      config: Release-Development
  KampusAgi-Staging:
    build:
      targets:
        KampusAgi: all
    run:
      config: Debug-Staging
    test:
      config: Debug-Staging
      targets:
        - KampusAgiTests
    archive:
      config: Release-Staging
  KampusAgi-Production:
    build:
      targets:
        KampusAgi: all
    run:
      config: Release-Production
    archive:
      config: Release-Production
